name: News federation full-season source proof
on:
  push:
    branches: [audit/news-data-fill-20261003]
    paths: [.github/workflows/news-hns-source-proof.yml]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read only federation and published provider URLs
        run: |
          mkdir -p evidence
          python - <<'PY'
          import pathlib,json,urllib.request,urllib.error,urllib.robotparser
          from urllib.parse import urlsplit
          root=pathlib.Path('evidence');agent='NinkoSports-NewsData/1.0 (+https://ninkosports.com)';policies={}
          urls=[('hns-home','https://semafor.hns.family/'),('hns-prva','https://semafor.hns.family/natjecanja/114348034/supersport-prva-nl/'),('denmark-docs','https://ss2.tjekscores.dk/superliga-docs/'),('belgium-directory','https://www.voetbalkrant.com/belgie/challenger-pro-league'),('swiss-league','https://www.srf.ch/sport/resultcenter?eventId=swiss-challenge-league'),('romania-league','https://www.frf.ro/competitii/liga-2/'),('saudi-league','https://www.saff.com.sa/championship.php?id=286')]
          def get(url,limit=5000000):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':agent}),timeout=20) as r:
                      raw=r.read(limit+1);assert len(raw)<=limit;encoding=r.headers.get_content_charset() or 'utf-8'
                      return {'url':url,'final_url':r.url,'status':r.status,'content_type':r.headers.get('Content-Type'),'text':raw.decode(encoding,errors='strict')}
              except urllib.error.HTTPError as e:return {'url':url,'status':e.code,'error':'http'}
              except Exception as e:return {'url':url,'error':type(e).__name__}
          for key,url in urls:
              origin='https://'+urlsplit(url).netloc
              if origin not in policies:policies[origin]=get(origin+'/robots.txt',100000)
              p=policies[origin];allow=p.get('status') in [404,410]
              if p.get('status')==200 and '<html' not in p.get('text','').lower():
                  rp=urllib.robotparser.RobotFileParser();rp.parse(p['text'].splitlines());allow=rp.can_fetch('NinkoSports-NewsData',url)
              d=get(url) if allow else {'url':url,'error':'robots_denied_or_unknown'}
              (root/(key+'.json')).write_text(json.dumps(d,ensure_ascii=False));print(key,d.get('status'),d.get('error'),len(d.get('text','')),flush=True)
          (root/'policies.json').write_text(json.dumps(policies,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-federation-season-proof
          path: evidence/
          retention-days: 7
