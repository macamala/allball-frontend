name: C15 leaf table navigation gate
on:
  push:
    branches: [fix/leaf-table-navigation-c15-20260925]
    paths: ['audit/c15_leaf_groups.patch', '.github/workflows/c15-leaf-table-gate.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          echo '3705f58da9aa0d145f68bd65be29d319e85ad2b0ebac338423953994ccbf8cd7  audit/c15_leaf_groups.patch' | sha256sum -c
          git apply --check audit/c15_leaf_groups.patch
          git apply audit/c15_leaf_groups.patch
          git add -N src/lib/competitionLeafGrouping.test.js
          mkdir -p evidence
          git diff a8a1a28dbbc94e0dee72fd21c6a5a287fe1f5bad -- src > evidence/source.patch
          cmp audit/c15_leaf_groups.patch evidence/source.patch
          npm ci
      - run: npm test -- --reporter=default --reporter=junit --outputFile=evidence/tests.xml
      - run: npm run build
      - name: Publish tested candidate only on isolated branch
        run: |
          git diff --check
          git config user.name 'NinkoSports regression checks'
          git config user.email '79318740+macamala@users.noreply.github.com'
          git add src
          git commit -m 'Keep same canonical group in one header and open its own standalone table'
          git push origin HEAD:refs/heads/fix/leaf-table-navigation-c15-20260925
          git rev-parse HEAD > evidence/candidate.txt
          sha256sum src/components/scores/EventList.jsx src/lib/sportsData.js src/lib/competitionLeafGrouping.test.js src/pages/CompetitionStandingsPage.test.jsx > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c15-leaf-table-gate
          path: evidence
          retention-days: 30
