name: Football News theme contrast gate 20261002
on:
  push:
    branches: [audit/news-football-20261002]
    paths: [.github/workflows/news-football-contrast-20261002.yml]
permissions:
  contents: write
jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VITE_API_URL: https://allball-backend-production.up.railway.app
      VITE_SITE_LANGUAGES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Correct only News theme tokens and add a regression assertion
        run: |
          test "$(git rev-parse HEAD)" = '03d771d93bc84a519e9b9a2cb4dda42c5f951a52'
          mkdir -p contrast-evidence
          python - <<'PY'
          from pathlib import Path
          p=Path('src/styles/newsFootballData.css');s=p.read_text()
          assert s.count('var(--surface,#fff)')==2
          s=s.replace('var(--surface,#fff)','var(--ns-surface,#102844)')
          s=s.replace('background:var(--ns-surface,#102844);min-width:0','background:var(--ns-surface,#102844);color:var(--ns-text,#f5f8fd);min-width:0')
          s += '\n.news-football-data .news-data-note{color:var(--ns-text-secondary,#c5d4ea);opacity:1}.news-football-data .standings-view-toggle{background:var(--ns-surface-hover,#1b3c60)}\n'
          p.write_text(s)
          t=Path('src/lib/newsFootballTheme.test.js')
          t.write_text('''import {it,expect} from 'vitest';
          import css from '../styles/newsFootballData.css?raw';
          it('uses existing paired NinkoSports theme tokens for readable News data',()=>{
            expect(css).not.toContain('var(--surface,');
            expect(css).toContain('background:var(--ns-surface,#102844)');
            expect(css).toContain('color:var(--ns-text,#f5f8fd)');
            expect(css).toContain('color:var(--ns-text-secondary,#c5d4ea)');
            expect(css).toContain('.news-football-data .standings-view-toggle');
          });
          ''')
          PY
      - name: Regression and production build gate
        run: |
          npm ci
          node node_modules/vitest/vitest.mjs run --exclude src/App.test.jsx > contrast-evidence/tests.txt 2>&1 || { cat contrast-evidence/tests.txt; exit 1; }
          npm run build > contrast-evidence/build.txt 2>&1 || { cat contrast-evidence/build.txt; exit 1; }
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Actual CSS and browser layout contrast validation against public data
        run: |
          npm run preview -- --host 127.0.0.1 > contrast-evidence/server.log 2>&1 &
          python - <<'PY'
          import json,pathlib,time,re
          from playwright.sync_api import sync_playwright
          root=pathlib.Path('contrast-evidence');checks=[]
          def lum(c):
              channels=[int(x)/255 for x in re.findall(r'\d+',c)[:3]]
              assert len(channels)==3,c
              channels=[v/12.92 if v<=0.04045 else ((v+.055)/1.055)**2.4 for v in channels]
              return sum(v*w for v,w in zip(channels,[.2126,.7152,.0722]))
          with sync_playwright() as p:
              b=p.chromium.launch()
              for width in [1440,390,320]:
                  page=b.new_page(viewport={'width':width,'height':900},timezone_id='Australia/Sydney')
                  page.goto('http://127.0.0.1:4173/football/brazil-serie-b',wait_until='domcontentloaded')
                  for tab in ['Fixtures','Results','Standings']:
                      page.get_by_role('tab',name=tab,exact=True).click()
                      panel=page.locator('.news-football-data');panel.wait_for()
                      page.wait_for_function("document.querySelector('.news-football-data')?.getAttribute('aria-busy') === 'false'",timeout=45000)
                      assert panel.locator('[role=alert]').count()==0
                      props=panel.evaluate('(el)=>({bg:getComputedStyle(el).backgroundColor,text:getComputedStyle(el).color,body:document.documentElement.scrollWidth,viewport:innerWidth})')
                      a,z=sorted([lum(props['bg']),lum(props['text'])]);ratio=(z+.05)/(a+.05)
                      assert ratio>=7,(width,tab,props,ratio)
                      assert props['body']<=width+3,props
                      if tab=='Standings':assert panel.locator('tbody tr').count()==20
                      panel.scroll_into_view_if_needed();page.screenshot(path=str(root/f'{width}-{tab.lower()}.png'),full_page=True)
                      checks.append({'width':width,'tab':tab,'contrast_ratio':ratio,**props})
                  page.close()
              b.close()
          (root/'contrast.json').write_text(json.dumps(checks,indent=2));print(json.dumps(checks,indent=2))
          PY
      - name: Preserve validated CSS-only production change on isolated release branch
        run: |
          git add src/styles/newsFootballData.css src/lib/newsFootballTheme.test.js
          git config user.name 'NinkoSports News validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(news): use correct dark theme surface and text tokens for football data'
          git push origin HEAD:refs/heads/audit/news-football-contrast-20261002
          git rev-parse HEAD > contrast-evidence/tested-commit.txt
          git diff HEAD^ --name-only > contrast-evidence/changed-files.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-news-contrast-20261002
          path: contrast-evidence/
          retention-days: 7
