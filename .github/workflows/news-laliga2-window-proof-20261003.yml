name: News LaLiga2 source calendar windows
on:
  push:
    branches: [audit/news-data-completion-20261003]
    paths: [.github/workflows/news-laliga2-window-proof-20261003.yml]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          mkdir -p evidence
          python - <<'PY'
          import urllib.request,urllib.error,json,pathlib,time
          root=pathlib.Path('evidence');rows=[]
          for value in ['2026','202610','202609','202611','2027']:
              url='https://site.web.api.espn.com/apis/site/v2/sports/soccer/esp.2/scoreboard?dates='+value+'&limit=1000'
              row={'date_value':value,'url':url}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'NinkoSports-NewsData/1.0'}),timeout=15) as r:
                      d=json.loads(r.read(6000000));(root/(value+'.json')).write_text(json.dumps(d));row.update(status=r.status,events=len(d.get('events',[])),uid=d.get('leagues',[{}])[0].get('uid'),first=d.get('events',[{}])[0].get('date'),last=d.get('events',[{}])[-1].get('date'))
              except urllib.error.HTTPError as e:
                  row['error']=e.code
                  if e.code in (401,403,429):rows.append(row);break
              except Exception as e:row['error']=str(e)
              rows.append(row);time.sleep(.5)
          (root/'summary.json').write_text(json.dumps(rows,indent=2));print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-laliga2-window-proof-20261003
          path: evidence/
          retention-days: 7
