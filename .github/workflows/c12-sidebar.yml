name: C12 scoped live sidebar gate
on:
  push:
    branches: [fix/live-sidebar-c12-20260925]
    paths: ['audit/c12_sidebar.patch', '.github/workflows/c12-sidebar.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          echo '4a4b8c3e14879145302f8ec6bbdbf87d2c27a727aea65d2c4e37e4c287d7fef5  audit/c12_sidebar.patch' | sha256sum -c
          git apply --check audit/c12_sidebar.patch
          git apply audit/c12_sidebar.patch
          git add -N src/pages/LiveScoresPage.test.jsx
          mkdir -p evidence
          git diff 9a18f3ec91610356304fc614b9a10b621792291f -- src/components/scores/EventRow.jsx src/pages/LiveScoresPage.jsx src/pages/LiveScoresPage.test.jsx src/styles.css > evidence/source.patch
          cmp audit/c12_sidebar.patch evidence/source.patch
          npm ci
      - run: npm test -- --reporter=default --reporter=junit --outputFile=evidence/tests.xml
      - run: npm run build
      - name: Publish tested candidate to isolated branch only
        run: |
          git diff --check
          git config user.name 'NinkoSports regression checks'
          git config user.email '79318740+macamala@users.noreply.github.com'
          git add src/components/scores/EventRow.jsx src/pages/LiveScoresPage.jsx src/pages/LiveScoresPage.test.jsx src/styles.css
          git commit -m 'Scope live sidebar to selected sport and make compact match names readable'
          git push origin HEAD:refs/heads/fix/live-sidebar-c12-20260925
          git rev-parse HEAD > evidence/candidate.txt
          sha256sum src/components/scores/EventRow.jsx src/pages/LiveScoresPage.jsx src/pages/LiveScoresPage.test.jsx src/styles.css > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c12-sidebar-evidence
          path: evidence
          retention-days: 30
