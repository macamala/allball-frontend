name: News restore source snapshot
on:
  push:
    branches: [fix/news-restore-entities-20261004]
    paths: [.github/workflows/news-restore-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 06a6c116ada23aa233e49776c4545ada4d193c87
          path: frontend
          fetch-depth: 6
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: macamala/allball-backend
          ref: f1199604bbbb0085c744ca3530db0c92996c7030
          path: backend
          persist-credentials: false
      - name: Save source and bounded public reads; no writers or database credentials
        run: |
          mkdir -p evidence
          git -C frontend archive --format=tar HEAD > evidence/frontend.tar
          git -C frontend archive --format=tar 0180f4b9aee08b4835e3eb7b207a9ecc4dabe12d > evidence/frontend-before-visible.tar
          git -C frontend diff 0180f4b9aee08b4835e3eb7b207a9ecc4dabe12d HEAD > evidence/visible-changes.diff
          git -C backend archive --format=tar HEAD > evidence/backend.tar
          python - <<'PY'
          import json,pathlib,urllib.request,urllib.parse
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime,timezone
          root=pathlib.Path('evidence');base='https://allball-backend-production.up.railway.app'
          def get(path):
              try:
                  with urllib.request.urlopen(base+path,timeout=20) as r:return json.loads(r.read(8000000))
              except Exception as e:return {'read_error':str(e)[:150]}
          (root/'openapi.json').write_text(json.dumps(get('/openapi.json')))
          rows=get('/articles?sport=football&limit=100')
          (root/'articles.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          wanted=[]
          if isinstance(rows,list):
              for a in rows:
                  if any(term in a.get('title','').lower() for term in ['fernandes','marsch','canada','real sociedad','osasuna','arsenal']):wanted.append(a)
          def detail(a):return a['slug'],get('/articles/'+urllib.parse.quote(a['slug']))
          with ThreadPoolExecutor(max_workers=3) as pool:details=dict(pool.map(detail,wanted[:12]))
          (root/'article-details.json').write_text(json.dumps(details,ensure_ascii=False,indent=2))
          (root/'checked.json').write_text(json.dumps({'at':datetime.now(timezone.utc).isoformat(),'AI_requests':0,'client_writes':0}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-restore-snapshot-20261004
          path: evidence/
          retention-days: 7
