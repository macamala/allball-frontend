name: C14 profile presentation gate
on:
  push:
    branches: [fix/profile-layout-c14-20260925]
    paths: ['.github/workflows/c14-profile-layout.yml','audit/c14_profile_layout.patch','audit/c14_profile_browser.py']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          echo '3bf0a098bf6cc3991a4eb20eb9b12239a66db6131041b26bd8c993549bb7b341  audit/c14_profile_layout.patch' | sha256sum -c
          git apply --check audit/c14_profile_layout.patch
          git apply audit/c14_profile_layout.patch
          git add -N src/styles/entityProfiles.css
          mkdir -p evidence
          git diff 39604cfc6caa051e934d8d6a97dfa0fd92280807 -- src > evidence/source.patch
          cmp audit/c14_profile_layout.patch evidence/source.patch
          npm ci
      - run: npm test -- --reporter=default --reporter=junit --outputFile=evidence/tests.xml
      - run: npm run build
        env:
          VITE_API_URL: https://allball-backend-production.up.railway.app
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python audit/c14_profile_browser.py
      - name: Publish tested profile layout to isolated branch only
        run: |
          git diff --check
          git config user.name 'NinkoSports regression checks'
          git config user.email '79318740+macamala@users.noreply.github.com'
          git add src
          git commit -m 'Present player value with identity and align player/team facts in a coherent responsive profile'
          git push origin HEAD:refs/heads/fix/profile-layout-c14-20260925
          git rev-parse HEAD > evidence/candidate.txt
          sha256sum src/pages/PlayerPage.jsx src/pages/TeamPage.jsx src/styles/entityProfiles.css > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c14-profile-layout
          path: evidence
          retention-days: 30
