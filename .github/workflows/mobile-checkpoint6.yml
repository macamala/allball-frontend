name: Checkpoint 6 mobile standings regression gate
on:
  push:
    branches: [fix/mobile-standings-20260925]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_API_URL: https://allball-backend-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore exact saved patch
        run: python audit/apply_mobile_checkpoint6.py
      - run: npm ci
      - name: Full frontend suite and production build
        run: |
          mkdir -p /tmp/mobile-evidence
          npm test -- --reporter=default --reporter=json --outputFile=/tmp/mobile-evidence/vitest.json
          npm run build
      - name: Independent browser prerequisites
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test production bundle at phone and desktop widths
        run: |
          npx vite preview --host 127.0.0.1 --port 5173 > /tmp/mobile-evidence/preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
          python audit/mobile_standings_browser.py
      - name: Preserve exact tested source
        if: always()
        run: |
          mkdir -p /tmp/mobile-evidence
          git add -N src
          git diff -- src > /tmp/mobile-evidence/source.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-checkpoint6-evidence
          path: /tmp/mobile-evidence
          retention-days: 14
  publish-tested-branch:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: |
          python3 audit/apply_mobile_checkpoint6.py
          git add src
          git config user.name 'NinkoSports recovery checks'
          git config user.email '79318740+macamala@users.noreply.github.com'
          git commit -m 'Mobile standings compact/full view and visible active match tab; full suite and browser verified'
          git push origin HEAD:fix/mobile-standings-20260925
          echo "TESTED_SOURCE_COMMIT=$(git rev-parse HEAD)"
