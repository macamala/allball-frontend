name: Football News final public browser proof 20261003
on:
  push:
    branches: [audit/news-football-20261003]
    paths: [.github/workflows/news-football-final-browser-20261003.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - name: Check actual production tabs, complete article copy and decoded hero photos
        run: |
          mkdir -p final-browser
          python - <<'PY'
          import json,pathlib,urllib.request,re
          from playwright.sync_api import sync_playwright
          root=pathlib.Path('final-browser');checks=[];failures=[]
          slug='uefa-to-assess-real-madrid-documents-in-barcelona-football-case'
          with urllib.request.urlopen('https://allball-backend-production.up.railway.app/articles/'+slug,timeout=25) as r:article=json.loads(r.read())
          expected_title=article['title'];expected_copy=' '.join(article['content'].split())[:100]
          assert len(article['content'].split())>=150 and article['image_url']
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for width in [1440,390,320]:
                  page=browser.new_page(viewport={'width':width,'height':900},timezone_id='Australia/Sydney')
                  errors=[];writes=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.on('request',lambda r:writes.append(r.url) if '/sports-data/' in r.url and r.method not in ['GET','HEAD','OPTIONS'] else None)
                  for path,expected,phase in [('mexico-liga-expansion',16,'Apertura'),('womens-champions-league',18,None)]:
                      row={'width':width,'path':path,'tabs':{}}
                      try:
                          page.goto('https://ninkosports.com/football/'+path,wait_until='domcontentloaded',timeout=45000)
                          for tab in ['Fixtures','Results','Standings']:
                              page.get_by_role('tab',name=tab,exact=True).click()
                              panel=page.locator('.news-football-data');panel.wait_for()
                              page.wait_for_function("document.querySelector('.news-football-data')?.getAttribute('aria-busy') === 'false'",timeout=45000)
                              assert not panel.locator('[role=alert]').count(),panel.inner_text()
                              count=panel.locator('tbody tr').count() if tab=='Standings' else panel.locator('.news-data-match').count()
                              assert count==expected if tab=='Standings' else count>0,(path,tab,count)
                              if phase:assert 'Competition phase: '+phase in panel.inner_text()
                              dimensions=page.evaluate('({body:document.documentElement.scrollWidth,viewport:innerWidth})')
                              assert dimensions['body']<=width+3,dimensions
                              row['tabs'][tab]={'displayed_rows':count,'phase':phase,'dimensions':dimensions}
                              if tab=='Standings':panel.scroll_into_view_if_needed();page.screenshot(path=str(root/f'{width}-{path}-table.png'),full_page=True)
                      except Exception as e:row['error']=str(e)[:600];failures.append(row)
                      checks.append(row)
                  row={'width':width,'article_slug':slug}
                  try:
                      page.goto('https://ninkosports.com/article/'+slug,wait_until='domcontentloaded',timeout=45000)
                      page.wait_for_function("expected => document.querySelector('.article-page h1')?.textContent.trim() === expected",arg=expected_title,timeout=25000)
                      page.wait_for_function("expected => [...document.querySelectorAll('.article-page .article-body')].some(el => el.innerText.replace(/\\s+/g,' ').includes(expected) && el.innerText.split(/\\s+/).length >= 150)",arg=expected_copy,timeout=25000)
                      hero=page.locator('.article-page img').first
                      hero.wait_for()
                      hero.scroll_into_view_if_needed()
                      page.wait_for_function("() => { const i=document.querySelector('.article-page img');return i && i.complete && i.naturalWidth>=200;}",timeout=25000)
                      row.update(title=page.locator('.article-page h1').inner_text(),body_words=max(page.locator('.article-page .article-body').all_inner_texts(),key=len).split().__len__(),hero=hero.evaluate('(i)=>({src:i.currentSrc,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight})'))
                      assert row['hero']['src']==article['image_url'] or article['image_url'] in row['hero']['src'],row['hero']
                      dimensions=page.evaluate('({body:document.documentElement.scrollWidth,viewport:innerWidth})');assert dimensions['body']<=width+3,dimensions
                      page.screenshot(path=str(root/f'{width}-complete-article.png'),full_page=True)
                  except Exception as e:
                      row['error']=str(e)[:600];failures.append(row)
                      try:page.screenshot(path=str(root/f'{width}-article-error.png'),full_page=True)
                      except Exception:pass
                  checks.append(row)
                  if errors:failures.append({'width':width,'page_errors':errors})
                  if writes:failures.append({'width':width,'unexpected_sports_writes':writes})
                  page.close()
              browser.close()
          summary={'production_origin':True,'mocked_requests':False,'checks':checks,'failures':failures}
          (root/'proof.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary,indent=2));assert not failures,failures
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-news-final-browser-20261003
          path: final-browser/
          retention-days: 7
