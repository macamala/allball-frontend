name: News data fill baseline
on:
  push:
    branches: [audit/news-data-fill-20261003]
    paths: [.github/workflows/news-data-fill-baseline.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0180f4b9aee08b4835e3eb7b207a9ecc4dabe12d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source snapshot and bounded public reads only
        run: |
          mkdir -p evidence
          git archive --format=tar HEAD > evidence/frontend.tar
          python - <<'PY'
          import json,pathlib,urllib.request,urllib.error,urllib.robotparser,time
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import urlsplit
          root=pathlib.Path('evidence');agent='NinkoSports-NewsData/1.0 (+https://ninkosports.com)'
          def read(url,limit=4000000):
              req=urllib.request.Request(url,headers={'User-Agent':agent,'Accept':'application/json,text/html,text/plain;q=0.9'})
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:
                      body=r.read(limit+1);assert len(body)<=limit
                      return {'url':url,'final_url':r.url,'status':r.status,'type':r.headers.get('Content-Type',''),'text':body.decode('utf-8','replace')}
              except urllib.error.HTTPError as e:return {'url':url,'status':e.code,'error':'http'}
              except Exception as e:return {'url':url,'error':type(e).__name__+': '+str(e)[:100]}
          origins=['https://site.web.api.espn.com','https://site.api.espn.com','https://prvaliga.rs','https://www.prvaliga.rs']
          policies={}
          for origin in origins:
              policy=read(origin+'/robots.txt',100000);policies[origin]=policy
          (root/'policies.json').write_text(json.dumps(policies,indent=2))
          def allowed(url):
              origin='https://'+urlsplit(url).netloc;p=policies.get(origin,{})
              if p.get('status') in [404,410]:return True
              if p.get('status')!=200 or '<html' in p.get('text','').lower():return False
              rp=urllib.robotparser.RobotFileParser();rp.parse(p['text'].splitlines());return rp.can_fetch('NinkoSports-NewsData',url)
          urls={
            'public-prva-table':'https://ninkosports.com/news-data/football/serbia-prva-liga/standings',
            'public-prva-matches':'https://ninkosports.com/news-data/football/serbia-prva-liga/matches',
            'prva-table':'https://www.prvaliga.rs/sezona/tebela-takmicenja/',
            'api-competitions':'https://allball-backend-production.up.railway.app/sports-data/competitions?sport=football',
            'api-championship':'https://allball-backend-production.up.railway.app/sports-data/standings?league=england-championship',
          }
          for code in ['eng.2','esp.2','ita.2','gre.1','jpn.1','aus.1','uefa.europa','uefa.europa.conf','conmebol.libertadores','afc.champions','caf.champions','sui.2','bel.2','tur.2','den.2','aut.2','arg.2']:
              urls['table-'+code]='https://site.web.api.espn.com/apis/v2/sports/soccer/'+code+'/standings'
          for code in ['eng.2','esp.2','jpn.1','uefa.europa']:
              urls['matches-'+code]='https://site.api.espn.com/apis/site/v2/sports/soccer/'+code+'/scoreboard?dates=20260901-20261031&limit=1000'
          def probe(pair):
              key,url=pair
              if urlsplit(url).netloc in ['ninkosports.com','allball-backend-production.up.railway.app'] or allowed(url):r=read(url)
              else:r={'url':url,'error':'robots_unavailable_or_denied'}
              (root/(key+'.json')).write_text(json.dumps(r,ensure_ascii=False));print(key,r.get('status'),r.get('error'),len(r.get('text','')),flush=True)
          with ThreadPoolExecutor(max_workers=2) as pool:list(pool.map(probe,urls.items()))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-data-fill-baseline
          path: evidence/
          retention-days: 7
