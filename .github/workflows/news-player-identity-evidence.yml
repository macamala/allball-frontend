name: News missing player identity evidence
on:
  push:
    branches: [fix/news-restore-entities-20261004]
    paths: [.github/workflows/news-player-identity-evidence.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Public source records and existing profiles only; no edits or AI calls
        run: |
          mkdir -p player-evidence
          python - <<'PY'
          import json,pathlib,urllib.request,urllib.parse,unicodedata
          from datetime import datetime,timezone
          root=pathlib.Path('player-evidence');results=[]
          def norm(text):return ''.join(c for c in unicodedata.normalize('NFKD',str(text or '')).casefold() if not unicodedata.combining(c))
          cases=[('8687','Crvena zvezda','serbia-superliga',['Rade Krunic']),('9770','Flamengo','brazil-serie-a',['Samuel Lino','Giorgian de Arrascaeta']),('9831','Nice','france-ligue-1',['Axel Witsel']),('162162','SJK','finland-veikkausliiga',['Roope Paunio'])]
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'NinkoSports-News-Identity/1.0','Accept':'application/json'}),timeout=15) as r:
                  assert r.status==200 and 'application/json' in r.headers.get('Content-Type','')
                  return json.loads(r.read(8000000))
          for tid,name,key,names in cases:
              out={'id':tid,'expected_team':name,'competition':key,'player_candidates':[]}
              try:
                  data=get('https://www.fotmob.com/api/data/teams?id='+tid)
                  (root/(tid+'-team.json')).write_text(json.dumps(data,ensure_ascii=False))
                  out['root_fields']=list(data);out['details']=data.get('details')
                  def visit(value,path):
                      if isinstance(value,dict):
                          label=value.get('name');pid=value.get('id')
                          if label and pid and any(norm(label)==norm(n) for n in names):out['player_candidates'].append({'path':path,'record':value})
                          for k,v in value.items():visit(v,path+'/'+str(k))
                      elif isinstance(value,list):
                          for i,v in enumerate(value):visit(v,path+'/'+str(i))
                  visit(data,'')
                  ids=set()
                  for candidate in out['player_candidates']:
                      player=candidate['record'];pid=str(player['id'])
                      if not pid.isdigit() or pid in ids:continue
                      ids.add(pid)
                      try:
                          full=get('https://www.fotmob.com/api/data/playerData?id='+pid)
                          (root/(pid+'-player.json')).write_text(json.dumps(full,ensure_ascii=False))
                          candidate['profile_id']=full.get('id');candidate['profile_name']=full.get('name')
                          query=urllib.parse.urlencode({'name':player['name'],'competition_key':key})
                          profile=get('https://allball-backend-production.up.railway.app/sports-data/players/'+pid+'?'+query)
                          candidate['existing_profile_available']=profile.get('available')
                          (root/(pid+'-existing.json')).write_text(json.dumps(profile,ensure_ascii=False))
                      except Exception as e:candidate['profile_error']=type(e).__name__+': '+str(e)[:120]
              except Exception as e:out['error']=type(e).__name__+': '+str(e)[:120]
              results.append(out);print(json.dumps(out,ensure_ascii=False)[:2000],flush=True)
          (root/'summary.json').write_text(json.dumps({'checked_at':datetime.now(timezone.utc).isoformat(),'results':results,'writes':0,'AI_requests':0,'note':'Evidence only; squad candidates are not yet published article links.'},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-player-identity-evidence-20261004
          path: player-evidence/
          retention-days: 7
