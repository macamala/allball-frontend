name: News player source snapshot
on:
  push:
    branches: [fix/news-player-resolution-20261004]
    paths: [.github/workflows/news-player-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 12f5180c451d596ce5a13b96172a6fcdb96d1da2
          persist-credentials: false
      - run: mkdir -p snapshot && git archive --format=tar HEAD > snapshot/frontend.tar
      - uses: actions/upload-artifact@v4
        with:
          name: news-player-source-20261004
          path: snapshot/
          retention-days: 7
