name: News official Prva full table proof
on:
  push:
    branches: [audit/news-data-completion-20261003]
    paths: [.github/workflows/news-prva-table-proof-20261003.yml]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - run: |
          mkdir -p evidence
          python - <<'PY'
          import urllib.request,urllib.error,urllib.robotparser,pathlib,json
          from playwright.sync_api import sync_playwright
          root=pathlib.Path('evidence');rows=[]
          urls={'prva-table':'https://www.prvaliga.rs/sezona/tebela-takmicenja/','web-day':'https://site.web.api.espn.com/apis/site/v2/sports/soccer/esp.2/scoreboard?dates=20261003&limit=100'}
          headers={'User-Agent':'NinkoSports-NewsData/1.0 (+https://ninkosports.com)'}
          for name,url in urls.items():
              row={'name':name,'url':url}
              try:
                  if name=='prva-table':
                      with urllib.request.urlopen(urllib.request.Request('https://www.prvaliga.rs/robots.txt',headers=headers),timeout=12) as r:robots=r.read(100000).decode('utf-8','replace')
                      (root/'robots.txt').write_text(robots)
                      rp=urllib.robotparser.RobotFileParser();rp.parse(robots.splitlines());assert rp.can_fetch(headers['User-Agent'],url),'robots disallow'
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=15) as r:
                      raw=r.read(3000000);(root/(name+'.txt')).write_bytes(raw);row.update(status=r.status,size=len(raw),type=r.headers.get('Content-Type'))
              except Exception as e:row['error']=type(e).__name__+': '+str(e)
              rows.append(row)
          with sync_playwright() as p:
              b=p.chromium.launch();page=b.new_page();page.goto('https://ninkosports.com',wait_until='domcontentloaded')
              result=page.evaluate("async(url)=>{try{const r=await fetch(url,{credentials:'omit',signal:AbortSignal.timeout(12000)});const d=await r.json();return {status:r.status,events:d.events?.length,uid:d.leagues?.[0]?.uid};}catch(e){return {error:String(e)};}}",urls['web-day']);b.close()
          (root/'summary.json').write_text(json.dumps({'reads':rows,'browser_web_day':result},indent=2));print(json.dumps({'reads':rows,'browser_web_day':result},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-prva-table-proof-20261003
          path: evidence/
          retention-days: 7
