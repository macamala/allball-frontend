name: Football News final public verification 20261002
on:
  push:
    branches: [audit/news-football-20261002]
    paths: [.github/workflows/news-football-final-public-20261002.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 804f7b1393de9c0ca9e2e8d6bbe64e7ddc525ab0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - name: Real deployed page, real CSS, real public data
        run: |
          mkdir -p public-browser
          python - <<'PY'
          import json,pathlib,re
          from datetime import datetime,timezone
          from playwright.sync_api import sync_playwright
          root=pathlib.Path('public-browser');rows=[];failures=[]
          def lum(c):
              channels=[int(x)/255 for x in re.findall(r'\d+',c)[:3]]
              assert len(channels)==3,c
              return sum((v/12.92 if v<=.04045 else ((v+.055)/1.055)**2.4)*w for v,w in zip(channels,[.2126,.7152,.0722]))
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for width in [1440,390,320]:
                  page=browser.new_page(viewport={'width':width,'height':950},timezone_id='Australia/Sydney');errors=[];writes=[]
                  page.on('pageerror',lambda error: errors.append(str(error)))
                  page.on('request',lambda request: writes.append(request.url) if '/sports-data/' in request.url and request.method not in ['GET','HEAD','OPTIONS'] else None)
                  for slug in ['premier-league','la-liga','brazil-serie-b','south-korea-k-league-1']:
                      row={'width':width,'slug':slug,'tabs':{}}
                      try:
                          response=page.goto('https://ninkosports.com/football/'+slug,wait_until='domcontentloaded',timeout=45000);row['http']=response.status
                          page.get_by_role('tab',name='News',exact=True).wait_for(timeout=20000)
                          for tab in ['Fixtures','Results','Standings']:
                              page.get_by_role('tab',name=tab,exact=True).click()
                              panel=page.locator('.news-football-data');panel.wait_for()
                              page.wait_for_function("document.querySelector('.news-football-data')?.getAttribute('aria-busy') === 'false'",timeout=45000)
                              props=panel.evaluate('(el)=>({bg:getComputedStyle(el).backgroundColor,text:getComputedStyle(el).color,body:document.documentElement.scrollWidth,viewport:innerWidth})')
                              lo,hi=sorted([lum(props['bg']),lum(props['text'])]);ratio=(hi+.05)/(lo+.05)
                              data={'matches':panel.locator('.news-data-match').count(),'table_rows':panel.locator('tbody tr').count(),'alerts':panel.locator('[role=alert]').count(),'contrast_ratio':ratio,'text':panel.inner_text()[:900],**props};row['tabs'][tab]=data
                              assert ratio>=7,(slug,tab,ratio)
                              assert props['body']<=width+3,props
                              assert data['alerts']==0,data['text']
                              if tab=='Standings' and slug!='south-korea-k-league-1':assert data['table_rows']>=10,data
                              if tab=='Results' and slug in ['premier-league','la-liga']:assert data['matches']>0,data
                              if tab=='Standings' or (width==390 and slug=='premier-league' and tab=='Results'):
                                  panel.scroll_into_view_if_needed();page.screenshot(path=str(root/f'{width}-{slug}-{tab.lower()}.png'),full_page=True)
                          page.get_by_role('tab',name='News',exact=True).click()
                          assert page.locator('.news-football-data').count()==0
                      except Exception as exc:
                          failures.append({'width':width,'slug':slug,'error':str(exc)[:600]});row['error']=str(exc)[:600]
                      rows.append(row);(root/'browser.json').write_text(json.dumps(rows,indent=2))
                  if errors or writes:failures.append({'width':width,'page_errors':errors,'unexpected_writes':writes})
                  page.close()
              browser.close()
          summary={'checked_at':datetime.now(timezone.utc).isoformat(),'cases':len(rows),'tab_checks':sum(len(r['tabs']) for r in rows),'failures':failures,'css_injected':False,'requests_mocked':False,'production_origin':True}
          (root/'summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary,indent=2));assert not failures
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-news-final-public-browser-20261002
          path: public-browser/
          retention-days: 7
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 804f7b1393de9c0ca9e2e8d6bbe64e7ddc525ab0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure actual News articles and independently scoped data for every menu
        run: |
          mkdir -p public-coverage
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {readNewsData,newsMatches,FOOTBALL_NEWS_TOPICS} from './src/lib/newsFootballData.js';
          const catalog=JSON.parse(fs.readFileSync('src/config/newsFootballLeagues.json','utf8'));
          const base='https://allball-backend-production.up.railway.app';const rows=[];
          async function get(path,options={}){const response=await fetch(base+path,{...options,signal:options.signal||AbortSignal.timeout(18000)});if(!response.ok)throw Error('HTTP '+response.status);return response.json();}
          async function check(row){const out={league:row.league,label:row.label,path:row.path,checked_at:new Date().toISOString()};
            try{const articles=await get('/articles?'+new URLSearchParams({sport:'football',league:row.league,limit:'3'}));out.articles=articles.map(a=>({id:a.id,slug:a.slug,title:a.title,league:a.league,published_at:a.published_at,created_at:a.created_at,image:a.image_url||a.image}));out.recent=out.articles.filter(a=>Date.now()-Date.parse(a.published_at.endsWith('Z')||/[+-]\d\d:\d\d$/.test(a.published_at)?a.published_at:a.published_at+'Z')<86400000).length;out.wrong_league=out.articles.filter(a=>a.league!==row.league).length;}catch(error){out.news_error=String(error);}
            if(!FOOTBALL_NEWS_TOPICS.has(row.league)){
              try{const data=await readNewsData(get,row.league,'standings');out.table={rows:data.rows?.length||0,season:data.season,updated_at:data.updated_at,stale:data.stale,competition:data.competition};}catch(error){out.table_error=String(error);}
              try{const data=await readNewsData(get,row.league,'fixtures');out.matches={fixtures:newsMatches(data,row.league,{view:'fixtures'}).length,results:newsMatches(data,row.league,{view:'results'}).length,other:newsMatches(data,row.league,{view:'other'}).length,checked_at:data.checked_at,coverage:data.coverage};}catch(error){out.matches_error=String(error);}
            }
            rows.push(out);fs.writeFileSync('public-coverage/coverage.json',JSON.stringify(rows,null,2));console.log(row.league,'articles',out.articles?.length||0,'table',out.table?.rows||0,'matches',out.matches?.fixtures||0,out.matches?.results||0,out.news_error||out.table_error||out.matches_error||'');}
          const queue=[...catalog];await Promise.all(Array.from({length:3},async()=>{while(queue.length)await check(queue.shift());}));
          const summary={checked_at:new Date().toISOString(),menus:rows.length,news_nonempty:rows.filter(r=>r.articles?.length).length,news_recent:rows.filter(r=>r.recent).length,tables_nonempty:rows.filter(r=>r.table?.rows).length,fixtures_nonempty:rows.filter(r=>r.matches?.fixtures).length,results_nonempty:rows.filter(r=>r.matches?.results).length,empty_news:rows.filter(r=>!r.articles?.length).map(r=>r.league),cross_league_articles:rows.reduce((sum,r)=>sum+(r.wrong_league||0),0),errors:rows.filter(r=>r.news_error||r.table_error||r.matches_error).map(r=>({league:r.league,news:r.news_error,table:r.table_error,matches:r.matches_error}))};
          fs.writeFileSync('public-coverage/summary.json',JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-news-final-public-coverage-20261002
          path: public-coverage/
          retention-days: 7
