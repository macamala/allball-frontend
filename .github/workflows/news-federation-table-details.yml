name: News federation table details
on:
  push:
    branches: [audit/news-data-fill-20261003]
    paths: [.github/workflows/news-federation-table-details.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public published pages with source-policy checks
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json,pathlib,urllib.request,urllib.error,urllib.robotparser
          from urllib.parse import urlsplit
          root=pathlib.Path('evidence');agent='NinkoSports-NewsData/1.0 (+https://ninkosports.com)';policies={}
          pages=[('saff-index','https://www.saff.com.sa/en/championships.php'),('saff-table','https://www.saff.com.sa/en/championship.php?id=416'),('denmark-openapi','https://ss2.tjekscores.dk/superliga-docs/swagger-ui-init.js')]
          def get(url,limit=4000000):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':agent}),timeout=18) as r:
                      body=r.read(limit+1);assert len(body)<=limit
                      return {'url':url,'final_url':r.url,'status':r.status,'content_type':r.headers.get('Content-Type'),'text':body.decode(r.headers.get_content_charset() or 'utf-8',errors='strict')}
              except urllib.error.HTTPError as e:return {'url':url,'status':e.code,'error':'http'}
              except Exception as e:return {'url':url,'error':type(e).__name__}
          for key,url in pages:
              origin='https://'+urlsplit(url).netloc
              if origin not in policies:policies[origin]=get(origin+'/robots.txt',100000)
              p=policies[origin];allow=p.get('status') in [404,410]
              if p.get('status')==200 and '<html' not in p.get('text','').lower():
                  rp=urllib.robotparser.RobotFileParser();rp.parse(p['text'].splitlines());allow=rp.can_fetch('NinkoSports-NewsData',url)
              d=get(url) if allow else {'url':url,'error':'robots_denied_or_unknown'}
              (root/(key+'.json')).write_text(json.dumps(d,ensure_ascii=False));print(key,d.get('status'),d.get('error'),len(d.get('text','')),flush=True)
          (root/'policies.json').write_text(json.dumps(policies,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-federation-table-details
          path: evidence/
          retention-days: 7
