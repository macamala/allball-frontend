name: Live Scores Branch CI

on:
  push:
    branches:
      - chatgpt/livescore-rebuild-20260923
  pull_request:
    branches:
      - master

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
