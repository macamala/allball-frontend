name: News visible production baseline
on:
  push:
    branches: [audit/news-visible-20261003]
    paths: [.github/workflows/news-visible-baseline.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0180f4b9aee08b4835e3eb7b207a9ecc4dabe12d
          path: frontend
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: macamala/allball-backend
          ref: 54b945d5d8527ef376832e59c7213aeb734613be
          path: backend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture public menu data and clean source
        run: |
          mkdir -p evidence
          git -C frontend archive --format=tar HEAD > evidence/frontend.tar
          git -C backend archive --format=tar HEAD > evidence/backend.tar
          python - <<'PY'
          import json,pathlib,urllib.request,urllib.parse
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime,timezone
          root=pathlib.Path('evidence');base='https://allball-backend-production.up.railway.app'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=25) as r:return json.loads(r.read(8000000))
          catalog=json.loads(pathlib.Path('frontend/src/config/newsFootballLeagues.json').read_text())
          def check(menu):
              try:
                  rows=get('/articles?'+urllib.parse.urlencode({'sport':'football','league':menu['league'],'limit':40}))
                  return {'menu':menu,'articles':rows}
              except Exception as e:return {'menu':menu,'error':str(e)[:200]}
          with ThreadPoolExecutor(max_workers=3) as pool:rows=list(pool.map(check,catalog))
          (root/'menus.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          (root/'openapi.json').write_text(json.dumps(get('/openapi.json')))
          summary={'checked_at':datetime.now(timezone.utc).isoformat(),'menus':len(rows),'nonempty':sum(bool(r.get('articles')) for r in rows),'empty':[r['menu']['league'] for r in rows if r.get('articles')==[]],'errors':[r for r in rows if r.get('error')]}
          (root/'summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary,indent=2))
          PY
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - name: Read actual website as a visitor without mocks
        run: |
          python - <<'PY'
          import pathlib,json
          from playwright.sync_api import sync_playwright
          root=pathlib.Path('evidence');out=[]
          with sync_playwright() as p:
              b=p.chromium.launch()
              for width in [1440,390]:
                  page=b.new_page(viewport={'width':width,'height':1000},timezone_id='Australia/Sydney')
                  for path in ['/','/football','/football/premier-league','/football/england-championship','/football/other-leagues']:
                      row={'width':width,'path':path,'errors':[]}
                      handler=lambda e:row['errors'].append(str(e))
                      page.on('pageerror',handler)
                      try:
                          response=page.goto('https://ninkosports.com'+path,wait_until='networkidle',timeout=45000)
                          page.wait_for_timeout(1500)
                          row.update(status=response.status,url=page.url,text=page.locator('body').inner_text()[:22000],cards=page.locator('a[href^="/article/"]').count(),scripts=page.locator('script[src]').evaluate_all('(s)=>s.map(x=>x.src)'))
                          row['article_links']=page.locator('a[href^="/article/"]').evaluate_all('(a)=>a.slice(0,8).map(x=>({text:x.innerText,href:x.getAttribute("href")}))')
                          page.screenshot(path=str(root/f'page-{width}-{path.strip("/").replace("/","-") or "home"}.png'),full_page=True)
                      except Exception as e:row['error']=str(e)[:300]
                      out.append(row);page.remove_listener('pageerror',handler)
                  page.close()
              b.close()
          (root/'browser.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-visible-baseline
          path: evidence/
          retention-days: 7
