name: Checkpoint11 identity assets frontend gate
on:
  push:
    branches: [fix/identity-assets-c11-20260925]
    paths: ['audit/apply_c11_assets_text.py', 'src/components/scores/CountryFlag.test.jsx', '.github/workflows/checkpoint11-assets.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 audit/apply_c11_assets_text.py
      - run: npm ci
      - run: |
          mkdir -p /tmp/c11-frontend
          npm test -- --reporter=default --reporter=junit --outputFile=/tmp/c11-frontend/tests.xml
          npm run build
      - if: always()
        run: |
          mkdir -p /tmp/c11-frontend
          git add -N src
          git diff --binary 99653b3e9af022cfedc430b43e94466720783d57 -- src > /tmp/c11-frontend/source.patch
          sha256sum /tmp/c11-frontend/source.patch
          git rev-parse HEAD > /tmp/c11-frontend/staging-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint11-frontend-gate
          path: /tmp/c11-frontend
          retention-days: 30
  publish-tested-source:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - run: |
          python3 audit/apply_c11_assets_text.py
          git add src
          git config user.name 'NinkoSports regression checks'
          git config user.email '79318740+macamala@users.noreply.github.com'
          git commit -m 'Display real country flags and repair exact official FIFA artwork routes'
          git push origin HEAD:fix/identity-assets-c11-20260925
          echo "TESTED_SOURCE_COMMIT=$(git rev-parse HEAD)"
