name: News public cross-league entity checks
on:
  push:
    branches: [fix/news-restore-entities-20261004]
    paths: [.github/workflows/news-entity-public-sample.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Bounded actual public reads without AI or content writes
        run: |
          mkdir -p entity-proof
          python - <<'PY'
          import json,pathlib,urllib.request,time
          from datetime import datetime,timezone
          from concurrent.futures import ThreadPoolExecutor
          root=pathlib.Path('entity-proof');api='https://allball-backend-production.up.railway.app';site='https://ninkosports.com'
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'NinkoSports-News-EntityAcceptance/1.0'}),timeout=65) as r:return json.loads(r.read(8000000))
          articles=get(api+'/articles?sport=football&limit=100')
          photos={'checked_at':datetime.now(timezone.utc).isoformat(),'sample':len(articles),'publisher_logo_ids':[a['id'] for a in articles if 'soccernews.com/og/og-image.' in str(a.get('image_url'))],'missing_photo_url_ids':[a['id'] for a in articles if not a.get('image_url')]}
          (root/'photos.json').write_text(json.dumps(photos,indent=2))
          preferred=['bruno-fernandes-urges-portugal-unity-amid-ronaldo-and-jesus-disagreement','canada-coach-jesse-marsch-cites-2-0-win-over-peru-ahead-of-usa-football-friendly','rade-kruni-returns-to-training-for-crvena-zvezda','samuel-lino-offers-to-fill-flamengos-midfield-role-during-arrascaetas-absence','martin-terriers-limited-role-at-bayer-leverkusen-leaves-his-future-uncertain','axel-witsel-joins-nice-to-mentor-young-players-after-leaving-girona','liverpool-lose-1-0-to-manchester-united-in-wsl','roope-paunio-reported-to-join-tampereen-ilves-next-season']
          def inspect(slug):
              row={'slug':slug}
              try:
                  article=get(api+'/articles/'+slug);row.update(id=article.get('id'),title=article.get('title'),league=article.get('league'))
                  start=time.monotonic();context=get(site+'/news-data/football/articles/'+slug+'/context');row['elapsed_seconds']=round(time.monotonic()-start,2)
                  assert context.get('slug')==slug and context.get('article_id')==article.get('id') and context.get('sport')=='football'
                  assert context.get('read_only') is True
                  row.update(teams=context['teams'],players=context['players'],matches=context['matches'],partial=context.get('partial'))
                  row['resolved_links']=len(row['teams'])+len(row['players'])+len(row['matches'])
              except Exception as e:row['error']=type(e).__name__+': '+str(e)[:250]
              (root/(slug+'.json')).write_text(json.dumps(row,ensure_ascii=False,indent=2));return row
          with ThreadPoolExecutor(max_workers=2) as pool:rows=list(pool.map(inspect,preferred))
          summary={'checked_at':datetime.now(timezone.utc).isoformat(),'article_count':len(rows),'with_verified_team_links':sum(bool(r.get('teams')) for r in rows),'with_verified_player_links':sum(bool(r.get('players')) for r in rows),'with_related_matches':sum(bool(r.get('matches')) for r in rows),'errors':[{k:r.get(k) for k in ['slug','error']} for r in rows if r.get('error')],'photo_sample':photos,'AI_requests':0,'sports_write_requests':0,'all_article_entities_complete':False}
          (root/'summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary,indent=2))
          assert not photos['publisher_logo_ids'],photos
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-entity-public-sample-20261004
          path: entity-proof/
          retention-days: 7
